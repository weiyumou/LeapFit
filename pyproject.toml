[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leapfit"
version = "0.1.0"
description = "LearnSphere-grounded student models over DataShop student-step data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Canwen Wang", email = "canwenw@andrew.cmu.edu" }]
keywords = ["educational-data-mining", "datashop", "learnsphere", "afm", "student-modeling"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# Deliberately minimal. Everything here is used by the core fitter; anything
# heavier (R bridges, plotting, LLM clients) belongs in an extra so that
# `import leapfit` stays cheap in a notebook.
#
# Floors are set at current majors rather than at the oldest version that
# happens to work. numpy 2 and pandas 3 both changed behaviour we depend on
# (copy-on-write semantics, sparse interop), and the test suite is run against
# them -- claiming support for older releases we never exercise would be a
# guess. Install with `uv sync` or `uv pip install -e ".[dev]"`.
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
leapfit-afm = "leapfit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["leapfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The data-free suite is the install check; the equivalence suite needs
# LearnSphere run artifacts and skips without them.
addopts = "-q"

[tool.ruff]
line-length = 100
# Must track requires-python. At py310 ruff does not know tomllib is stdlib and
# sorts it into the third-party import block.
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ISC",       # implicit string concat
    "EXE",       # shebangs
]
ignore = [
    "E501",   # long lines: prose in docstrings, and the tables we print
    "B905",   # zip(strict=): the paired iterables here are length-checked upstream
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741"]
